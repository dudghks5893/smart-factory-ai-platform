name: smartfactory

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-smartfactory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    image: smartfactory-api:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  api:
    image: smartfactory-api:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    command:
      - uvicorn
      - services.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
      PATCHCORE_ARTIFACT_DIR: /runtime/model
      PATCHCORE_THRESHOLDS_PATH: /runtime/thresholds/thresholds.json
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${PATCHCORE_ARTIFACT_DIR_HOST:-./artifacts/models/patchcore/current}
        target: /runtime/model
        read_only: true
      - type: bind
        source: ${PATCHCORE_THRESHOLDS_PATH_HOST:-./outputs/evaluation/patchcore/thresholds/current/thresholds.json}
        target: /runtime/thresholds/thresholds.json
        read_only: true
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  test:
    profiles: ["test"]
    image: smartfactory-api-test:${IMAGE_TAG:-local}
    build:
      context: .
      target: test
    command:
      - python
      - -m
      - pytest
      - -p
      - no:cacheprovider
      - tests/integration/test_postgres_container.py
      - -q
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
      POSTGRES_INTEGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: "no"

volumes:
  postgres_data:
