name: smartfactory

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-smartfactory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  migrate:
    image: smartfactory-api:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  api:
    image: smartfactory-api:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    command:
      - uvicorn
      - services.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
      PATCHCORE_ARTIFACT_DIR: /runtime/model
      PATCHCORE_THRESHOLDS_PATH: /runtime/thresholds/thresholds.json
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      YOLO_SEGMENTATION_ENABLED: ${YOLO_SEGMENTATION_ENABLED:-false}
      YOLO_SEGMENTATION_ARTIFACT_DIR: /runtime/yolo-segmentation
      YOLO_SEGMENTATION_DEVICE: ${YOLO_SEGMENTATION_DEVICE:-cpu}
      YOLO_SEGMENTATION_CONFIDENCE: ${YOLO_SEGMENTATION_CONFIDENCE:-0.25}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${PATCHCORE_ARTIFACT_DIR_HOST:-./artifacts/models/patchcore/current}
        target: /runtime/model
        read_only: true
      - type: bind
        source: ${PATCHCORE_THRESHOLDS_PATH_HOST:-./outputs/evaluation/patchcore/thresholds/current/thresholds.json}
        target: /runtime/thresholds/thresholds.json
        read_only: true
      - type: bind
        source: ${YOLO_SEGMENTATION_ARTIFACT_DIR_HOST:-./artifacts/runtime/yolo_segmentation/current}
        target: /runtime/yolo-segmentation
        read_only: true
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  test:
    profiles: ["test"]
    image: smartfactory-api-test:${IMAGE_TAG:-local}
    build:
      context: .
      target: test
    command:
      - python
      - -m
      - pytest
      - -p
      - no:cacheprovider
      - tests/integration/test_postgres_container.py
      - -q
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
      POSTGRES_INTEGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartfactory}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-smartfactory}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - type: bind
        source: ./monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - type: bind
        source: ./monitoring/grafana/provisioning/datasources/prometheus.yaml
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
        read_only: true
      - type: bind
        source: ./monitoring/grafana/provisioning/dashboards/dashboard.yaml
        target: /etc/grafana/provisioning/dashboards/dashboard.yaml
        read_only: true
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

  dashboard:
    image: smartfactory-dashboard:${IMAGE_TAG:-local}
    build:
      context: .
      target: dashboard-runtime
    command:
      - streamlit
      - run
      - apps/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=none
      - --browser.gatherUsageStats=false
    environment:
      DASHBOARD_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://api:8000}
      DRIFT_REPORT_DIR: /runtime/drift
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      DASHBOARD_REQUEST_TIMEOUT_SECONDS: ${DASHBOARD_REQUEST_TIMEOUT_SECONDS:-5}
      HOME: /tmp/dashboard-home
    volumes:
      - type: bind
        source: ${DRIFT_REPORT_DIR_HOST:-./outputs/drift/patchcore}
        target: /runtime/drift
        read_only: true
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  rag:
    profiles: ["rag"]
    image: smartfactory-rag:${IMAGE_TAG:-local}
    build:
      context: .
      target: rag-runtime
    command:
      - uvicorn
      - services.rag.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
    environment:
      RAG_INDEX_DIR: /runtime/rag/index
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-10}
      RAG_MIN_RETRIEVAL_SCORE: ${RAG_MIN_RETRIEVAL_SCORE:-0.2}
      RAG_REQUEST_TIMEOUT_SECONDS: ${RAG_REQUEST_TIMEOUT_SECONDS:-30}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai-compatible}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-model}
      RAG_GENERATION_PROVIDER: ${RAG_GENERATION_PROVIDER:-openai-compatible}
      RAG_GENERATION_MODEL: ${RAG_GENERATION_MODEL:-generation-model}
      RAG_PROVIDER_API_BASE_URL: ${RAG_PROVIDER_API_BASE_URL:-https://api.openai.com/v1}
      RAG_PROVIDER_API_KEY: ${RAG_PROVIDER_API_KEY:-}
    volumes:
      - type: bind
        source: ${RAG_INDEX_DIR_HOST:-./artifacts/rag/manuals/current}
        target: /runtime/rag/index
        read_only: true
    ports:
      - "${RAG_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
