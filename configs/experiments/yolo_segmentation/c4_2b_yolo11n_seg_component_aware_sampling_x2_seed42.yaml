  unique_train_count: 84
  unique_positive_count: 42
  unique_good_negative_count: 42
  small_aware_count: 14
  multi_component_count: 14
  eligible_overlap_count: 9
  eligible_union_count: 19
  expanded_entry_count: 103
  expanded_positive_count: 61
  expanded_good_negative_count: 42
  expanded_good_negative_ratio: 0.4077669902912621
  observed_train_small_cutoff: 0.011273469387755102

validation_protocol:
  split: val
  test_split_used: false
  diagnostic_confidence: 0.25
  matching_method: class_aware_greedy_max_mask_iou
  mask_iou_threshold: 0.5
  small_max_area_ratio: 0.015947619047619047
  medium_max_area_ratio: 0.02447142857142857

telemetry:
  sample_interval_seconds: 5.0
  nvidia_smi_timeout_seconds: 2.0

output:
  experiment_root: outputs/experiments/yolo_segmentation
  artifact_root: artifacts/models/yolo_segmentation/experiments
  training_runtime_root: outputs/training/yolo_segmentation/experiments
  package_root: outputs/packages

evaluation_priorities:
  primary:
    - validation_mask_map50_95
    - diagnostic_instance_recall
  failure_focused:
    - small_defect_recall
    - multi_component_recall
  guardrail:
    - good_negative_fp_image_rate
  secondary:
    - precision
    - f1
    - per_class_recall
    - unmatched_prediction_behavior
    - wrong_class_behavior
    - localization_behavior
  resource_tradeoff:
    - peak_vram
    - training_duration
    - artifact_size

decision_policy:
  require_mask_map50_95_non_regression: true
  require_instance_recall_non_regression: true
  require_small_recall_improvement: true
  require_multi_component_recall_non_regression: true
  allow_good_negative_fp_rate_increase: false
