experiment:
  experiment_id: c4_2c_yolo11n_seg_crop350_nomosaic_maskratio2_seed42
  date: 2026-08-31
  status: PLANNED
  intervention_type: component_aware_crop_confirmation
  hypothesis: The R17 crop350 and explicit augmentation recipe can confirm improved small-defect validation quality while preserving multi-component and good-negative quality.
  target_failure_mode: small_and_multi_component_recall
  baseline_config: configs/model/yolo_segmentation_baseline.yaml

baseline: &fixed_identity
  model: yolo11n-seg
  pretrained_checkpoint: yolo11n-seg.pt
  imgsz: 640
  seed: 42
  batch: 16
  epochs: 100
  patience: 20
  workers: 2
  optimizer: auto
  deterministic: true
  amp: true

baseline_evidence:
  sources:
    checkpoint_path: artifacts/runtime/yolo_segmentation/smartfactory_yolo11n_seg_metal_nut_seed42_t4/model/model.pt
    checkpoint_sha256: 594003121b0e071c47d68c3e53c10f438dcec18b5b56b4e5d8831d64001192bd
    metadata_path: artifacts/runtime/yolo_segmentation/smartfactory_yolo11n_seg_metal_nut_seed42_t4/model/metadata.json
    metadata_sha256: 9f3e3878141e831a6721c5136d67057da906485b9825262bd4e0897b2879fc6b
    checkpoint_metric_field: train_metrics
    checkpoint_epoch_field: train_results.epoch
    baseline_documentation: docs/vision/YOLO_SEGMENTATION_DATASET.md
    dependency_contract: pyproject.toml + uv.lock
  environment:
    gpu_model: Tesla T4
    torch_version: 2.13.0+cu130
    torchvision_version: 0.28.0+cu130
    torchvision_evidence_scope: linux_x86_64_uv_lock_resolution
    ultralytics_version: 8.4.128
  training:
    configured_epochs: 100
    completed_epochs: 80
    early_stopping: true
    best_epoch: 60
    checkpoint_cumulative_epoch_time_seconds: 222.485
    exact_end_to_end_wall_clock_seconds: null
  validation_framework:
    split: val
    test_split_used: false
    metric_source: selected_best_checkpoint.train_metrics
    box: {precision: 0.55955, recall: 0.59848, map50: 0.56157, map50_95: 0.32398}
    mask: {precision: 0.55955, recall: 0.59848, map50: 0.59929, map50_95: 0.34359}
  resource_metrics:
    pytorch_peak_allocated_bytes: null
    pytorch_peak_reserved_bytes: null
    sampled_device_memory_mib: null
    gpu_utilization_percent: null
    gpu_power_watts: null
  derived_test_metrics_used_for_selection: false

candidate: *fixed_identity

controlled_change:
  field: training.recipe
  before: c4_2b_component_aware_x2
  after: crop350_nomosaic_maskratio2

crop_sampling_policy:
  sampling_mode: component_aware_crop
  sampling_multiplicity: 2
  crop_size: 350

expected_crop_train_view:
  canonical_entries: 84
  canonical_positives: 42
  canonical_negatives: 42
  component_duplicate_entries: 19
  small_centered_crop_entries: 14
  total_entries: 117
  positive_exposure: 75
  negative_exposure: 42
  small_aware_count: 14
  multi_component_count: 14
  eligible_overlap_count: 9
  eligible_union_count: 19
  observed_train_small_cutoff: 0.011273469387755102

trainer_overrides:
  mosaic: 0.0
  mask_ratio: 2
  overlap_mask: true
  scale: 0.5

confirmation_protocol:
  initial_confidence: 0.001
  final_confidence: 0.25
  prediction_iou: 0.7
  max_det: 300
  retina_masks: false
  mask_threshold: 0.5
  mask_resize: opencv_inter_nearest
  matching_iou: 0.5
  small_recall_floor_exclusive: 0.25
  mask_map50_95_floor: 0.40
  multi_recall_floor: 0.50
  good_negative_fp_rate: 0.0

validation_protocol:
  split: val
  test_split_used: false
  diagnostic_confidence: 0.25
  matching_method: class_aware_greedy_max_mask_iou
  mask_iou_threshold: 0.5
  small_max_area_ratio: 0.015947619047619047
  medium_max_area_ratio: 0.02447142857142857

telemetry: {sample_interval_seconds: 5.0, nvidia_smi_timeout_seconds: 2.0}

output:
  experiment_root: outputs/experiments/yolo_segmentation
  artifact_root: artifacts/models/yolo_segmentation/experiments
  training_runtime_root: outputs/training/yolo_segmentation/experiments
  package_root: outputs/packages

evaluation_priorities:
  primary: [validation_mask_map50_95, diagnostic_instance_recall]
  failure_focused: [small_defect_recall, multi_component_recall]
  guardrail: [good_negative_fp_image_rate]
  secondary:
    - strict_recall
    - strict_f1
    - framework_mask_recall
    - region_coverage
  resource_tradeoff: [peak_vram, training_duration, artifact_size]

# Legacy policy remains present for schema compatibility; C4-2C uses confirmation_protocol gates.
decision_policy:
  require_mask_map50_95_non_regression: true
  require_instance_recall_non_regression: true
  require_small_recall_improvement: true
  require_multi_component_recall_non_regression: true
  allow_good_negative_fp_rate_increase: false
