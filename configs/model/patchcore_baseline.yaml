model:
  name: patchcore
  implementation: anomalib
  backbone: wide_resnet50_2
  layers:
    - layer2
    - layer3
  pretrained: true
  coreset_sampling_ratio: 0.1
  num_neighbors: 9

preprocessing:
  resize_size:
    - 256
    - 256
  center_crop_size:
    - 224
    - 224
  image_mean:
    - 0.485
    - 0.456
    - 0.406
  image_std:
    - 0.229
    - 0.224
    - 0.225

training:
  random_seed: 42
  device: auto
  batch_size: 4
  num_workers: 0

output:
  artifact_root: artifacts/models/patchcore
  prediction_root: outputs/predictions/patchcore
