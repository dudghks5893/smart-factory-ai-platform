apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartfactory-api
  labels:
    app.kubernetes.io/name: smartfactory-api
    app.kubernetes.io/part-of: smartfactory-ai-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smartfactory-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartfactory-api
        app.kubernetes.io/part-of: smartfactory-ai-platform
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: smartfactory-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smartfactory-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartfactory-api-secrets
                  key: database-url
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: model-artifacts
              mountPath: /runtime/model
              subPath: model
              readOnly: true
            - name: model-artifacts
              mountPath: /runtime/thresholds
              subPath: thresholds
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: smartfactory-model-artifacts
            readOnly: true
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
