apiVersion: batch/v1
kind: Job
metadata:
  name: smartfactory-api-migrate
  labels:
    app.kubernetes.io/name: smartfactory-api
    app.kubernetes.io/part-of: smartfactory-ai-platform
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "0.1.0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartfactory-api
        app.kubernetes.io/part-of: smartfactory-ai-platform
        app.kubernetes.io/component: migration
        app.kubernetes.io/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: smartfactory-api:local
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartfactory-api-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
