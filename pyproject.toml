[project]
name = "smart-factory-ai-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "anomalib==2.5.1",
    "fastapi>=0.141.1",
    "mlflow-skinny>=3.15,<4",
    "pillow>=12.3.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn==1.9.0",
    "sqlalchemy>=2.0,<3",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dashboard = [
    "streamlit==1.62.0",
]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
]
rag = [
    "fastapi==0.141.1",
    "numpy==2.5.2",
    "pydantic==2.13.4",
    "uvicorn==0.52.4",
]

[tool.uv]
default-groups = ["dev", "dashboard"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

exclude = [
    "^\\.venv/",
    "^data/",
    "^artifacts/",
]
